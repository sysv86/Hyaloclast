<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="HYALOCLAST mod box icon">
  <title>HYALOCLAST mod box icon</title>
  <style>
    @keyframes sweep{0%{transform:translateX(-120px)}55%,100%{transform:translateX(300px)}}
    @keyframes icon-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .icon-bob{animation:icon-bob 3.2s steps(5,end) infinite}
    .glint{animation:sweep 4.2s cubic-bezier(.4,0,.2,1) infinite}
</style>
  <defs>
    <linearGradient id="topg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8C8"/><stop offset=".6" stop-color="#FFE06A"/><stop offset="1" stop-color="#FFB93A"/></linearGradient>
    <linearGradient id="leftg" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="212"><stop offset="0" stop-color="#FFB93A"/><stop offset=".25" stop-color="#FF9624"/><stop offset=".65" stop-color="#EA5E12"/><stop offset="1" stop-color="#BD3808"/></linearGradient>
    <linearGradient id="rightg" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="212"><stop offset="0" stop-color="#C95214"/><stop offset=".5" stop-color="#94310A"/><stop offset="1" stop-color="#4D1605"/></linearGradient>
    <clipPath id="leftclip"><polygon points="44.0,80.0 128.0,116.0 128.0,212.0 44.0,176.0"/></clipPath>
    <clipPath id="topclip"><polygon points="128.0,44.0 212.0,80.0 128.0,116.0 44.0,80.0"/></clipPath>
    <linearGradient id="face-grad" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="212">
      <stop offset="0" stop-color="#FFF2A6"/><stop offset=".18" stop-color="#FFCE47"/><stop offset=".48" stop-color="#FF9624"/><stop offset=".78" stop-color="#EA5E12"/><stop offset="1" stop-color="#BD3808"/>
    </linearGradient>
    <linearGradient id="side-grad" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="212">
      <stop offset="0" stop-color="#C95214"/><stop offset=".5" stop-color="#94310A"/><stop offset="1" stop-color="#4D1605"/>
    </linearGradient>
    <linearGradient id="glint-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBE6" stop-opacity="0"/><stop offset=".5" stop-color="#FFFBE6" stop-opacity=".4"/><stop offset="1" stop-color="#FFFBE6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="top-bevel" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="212">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/><stop offset=".12" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset=".85" stop-color="#5E1600" stop-opacity="0"/><stop offset="1" stop-color="#4A1000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="plate-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA6F7"/><stop offset=".5" stop-color="#256BC0"/><stop offset="1" stop-color="#123A75"/>
    </linearGradient>
    <pattern id="shader-scan" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="8" height="2" fill="#FFF7D0" opacity=".06"/></pattern>
    <pattern id="voxel-glint" width="64" height="48" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="12" height="6" fill="#FFFBE0" opacity=".15"/><rect x="16" y="6" width="6" height="6" fill="#FFFBE0" opacity=".08"/><rect x="38" y="18" width="10" height="6" fill="#FFF7C2" opacity=".12"/>
      <rect x="22" y="30" width="12" height="6" fill="#FFFBE0" opacity=".10"/>
    </pattern>


  </defs>
  <ellipse cx="128" cy="228" rx="78" ry="11" fill="#2B1308" opacity=".22"/>
  <g class="icon-bob">
    <!-- outline -->
    <polygon points="128.0,44.0 212.0,80.0 212.0,176.0 128.0,212.0 44.0,176.0 44.0,80.0" fill="#2B1308" stroke="#2B1308" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="3"/>
    <!-- faces -->
    <polygon points="44.0,80.0 128.0,116.0 128.0,212.0 44.0,176.0" fill="url(#leftg)"/>
    <polygon points="128.0,116.0 212.0,80.0 212.0,176.0 128.0,212.0" fill="url(#rightg)"/>
    <polygon points="128.0,44.0 212.0,80.0 128.0,116.0 44.0,80.0" fill="url(#topg)"/>
    <!-- lid band + seam -->
    <polygon points="44.0,80.0 128.0,116.0 128.0,136.0 44.0,100.0" fill="#C9460E" opacity=".55"/>
    <polygon points="128.0,116.0 212.0,80.0 212.0,100.0 128.0,136.0" fill="#000" opacity=".28"/>
    <polyline points="44.0,100.0 128.0,136.0 212.0,100.0" fill="none" stroke="#2B1308" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- top: strap + hatch -->
    <polygon points="116.0,50.0 140.0,60.0 128.0,64.0 104.0,54.0" fill="#fff" opacity=".0"/>
    <polyline points="128.0,44.0 212.0,80.0 128.0,116.0 44.0,80.0 128.0,44.0" fill="none" stroke="#2B1308" stroke-width="3.2" stroke-linejoin="round"/>
    <polyline points="128.0,116.0 128.0,212.0" fill="none" stroke="#2B1308" stroke-width="3.2"/>
    <!-- top inner opening (voxel tray) -->
    <polygon points="128.0,60.0 184.0,82.0 128.0,104.0 72.0,82.0" fill="#7A2406" stroke="#2B1308" stroke-width="3"/>
    <polygon points="128.0,68.0 170.0,84.0 128.0,100.0 86.0,84.0" fill="#FFCE47" opacity=".9"/>
    <polygon points="128.0,68.0 170.0,84.0 128.0,100.0 86.0,84.0" fill="url(#voxel-glint)"/>
    <!-- label plate on left face -->
    <g transform="matrix(1 0.4286 0 1 44 80)">
      <rect x="12" y="42" width="60" height="44" fill="url(#plate-grad)" stroke="#2B1308" stroke-width="4" stroke-linejoin="miter"/>
      <rect x="15" y="45" width="54" height="5" fill="#fff" opacity=".35"/>
      <rect x="20" y="76" width="8" height="4" fill="#FFFDF0"/><rect x="32" y="76" width="8" height="4" fill="#FFFDF0"/><rect x="44" y="76" width="8" height="4" fill="#FFFDF0"/><rect x="56" y="76" width="8" height="4" fill="#FFFDF0"/>
    </g>
    <!-- texture + glint -->
    <g clip-path="url(#leftclip)"><rect x="40" y="76" width="92" height="140" fill="url(#voxel-glint)"/><rect x="40" y="76" width="92" height="140" fill="url(#shader-scan)"/>
      <g class="glint"><path d="M0 60h46l-18 170h-46z" fill="url(#glint-grad)"/></g></g>
    <g clip-path="url(#topclip)"><rect x="40" y="40" width="180" height="80" fill="url(#shader-scan)"/></g>
    <!-- right-face pixel marks -->
    <g transform="matrix(1 -0.4286 0 1 128 116)">
      <rect x="14" y="40" width="12" height="12" fill="#FFB93A" opacity=".35"/><rect x="40" y="62" width="12" height="12" fill="#FFB93A" opacity=".25"/><rect x="58" y="44" width="12" height="12" fill="#FFB93A" opacity=".3"/>
    </g>
  </g>
</svg>