<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="HYALOCLAST built-in shader packs icon">
  <title>HYALOCLAST built-in shader packs icon</title>
  <style>
    @keyframes sweep{0%{transform:translateX(-120px)}55%,100%{transform:translateX(300px)}}
    @keyframes icon-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .icon-bob{animation:icon-bob 3.2s steps(5,end) infinite}
    .glint{animation:sweep 4.2s cubic-bezier(.4,0,.2,1) infinite}
  </style>
  <defs>
    <polygon id="top-layer" points="128,36 220,86 128,136 36,86"/>
    <clipPath id="layer-clip"><use href="#top-layer"/></clipPath>
    <linearGradient id="face-grad" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="136">
      <stop offset="0" stop-color="#FFF2A6"/><stop offset=".22" stop-color="#FFCE47"/><stop offset=".55" stop-color="#FF9624"/><stop offset=".85" stop-color="#EA5E12"/><stop offset="1" stop-color="#BD3808"/>
    </linearGradient>
    <linearGradient id="side-grad" gradientUnits="userSpaceOnUse" x1="0" y1="86" x2="0" y2="216">
      <stop offset="0" stop-color="#C95214"/><stop offset=".5" stop-color="#94310A"/><stop offset="1" stop-color="#4D1605"/>
    </linearGradient>
    <linearGradient id="blue-grad" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="176">
      <stop offset="0" stop-color="#7CC2FF"/><stop offset=".55" stop-color="#5BA6F7"/><stop offset="1" stop-color="#2D6BC4"/>
    </linearGradient>
    <linearGradient id="glint-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBE6" stop-opacity="0"/><stop offset=".5" stop-color="#FFFBE6" stop-opacity=".42"/><stop offset="1" stop-color="#FFFBE6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="shader-scan" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="8" height="2" fill="#FFF7D0" opacity=".06"/></pattern>
  </defs>
  <g class="icon-bob">
    <!-- Bottom layer -->
    <polygon points="128,116 220,166 128,216 36,166" fill="#2B1308" stroke="#2B1308" stroke-width="14" stroke-linejoin="miter"/>
    <polygon points="128,116 220,166 128,216 36,166" fill="url(#side-grad)" stroke="#2B1308" stroke-width="8" stroke-linejoin="miter"/>
    <!-- Middle blue shader layer -->
    <polygon points="128,76 220,126 128,176 36,126" fill="#2B1308" stroke="#2B1308" stroke-width="14" stroke-linejoin="miter"/>
    <polygon points="128,76 220,126 128,176 36,126" fill="url(#blue-grad)" stroke="#2B1308" stroke-width="8" stroke-linejoin="miter"/>
    <!-- Top layer -->
    <use href="#top-layer" transform="translate(0 8)" fill="#2B1308" stroke="#2B1308" stroke-width="14" stroke-linejoin="miter"/>
    <use href="#top-layer" fill="url(#face-grad)" stroke="#2B1308" stroke-width="8" stroke-linejoin="miter"/>
    <g clip-path="url(#layer-clip)">
      <rect x="32" y="32" width="192" height="108" fill="url(#shader-scan)"/>
      <polygon points="128,62 164,86 128,110 92,86" fill="#FFF7D0" opacity=".28"/>
      <g class="glint"><path d="M0 32h48l-16 112h-48z" fill="url(#glint-grad)"/></g>
    </g>
  </g>
</svg>
