<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="HYALOCLAST SDK bench icon">
  <title>HYALOCLAST SDK bench icon</title>
  <style>
    @keyframes sweep{0%{transform:translateX(-120px)}55%,100%{transform:translateX(300px)}}
    @keyframes icon-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .icon-bob{animation:icon-bob 3.2s steps(5,end) infinite}
    .glint{animation:sweep 4.2s cubic-bezier(.4,0,.2,1) infinite}
  </style>
  <defs>
    <linearGradient id="face-grad" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="220">
      <stop offset="0" stop-color="#FFF2A6"/><stop offset=".18" stop-color="#FFCE47"/><stop offset=".48" stop-color="#FF9624"/><stop offset=".78" stop-color="#EA5E12"/><stop offset="1" stop-color="#BD3808"/>
    </linearGradient>
    <linearGradient id="plate-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA6F7"/><stop offset=".5" stop-color="#256BC0"/><stop offset="1" stop-color="#123A75"/>
    </linearGradient>
    <linearGradient id="glint-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBE6" stop-opacity="0"/><stop offset=".5" stop-color="#FFFBE6" stop-opacity=".4"/><stop offset="1" stop-color="#FFFBE6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sclip"><rect x="44" y="44" width="168" height="168" rx="14"/></clipPath>
  </defs>
  <g class="icon-bob">
    <rect x="44" y="44" width="168" height="168" rx="14" fill="url(#face-grad)" stroke="#2B1308" stroke-width="12"/>
    <g clip-path="url(#sclip)">
      <rect x="74" y="74" width="108" height="108" rx="8" fill="url(#plate-grad)" stroke="#2B1308" stroke-width="8"/>
      <polyline points="96,130 118,152 162,104" fill="none" stroke="#FFFBE6" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
      <g class="glint"><path d="M0 30h50l-18 190h-50z" fill="url(#glint-grad)"/></g>
    </g>
  </g>
</svg>
