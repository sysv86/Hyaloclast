<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="HYALOCLAST ray tracing icon">
  <title>HYALOCLAST ray tracing icon</title>
  <style>
    @keyframes sweep{0%{transform:translateX(-120px)}55%,100%{transform:translateX(300px)}}
    @keyframes icon-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .icon-bob{animation:icon-bob 3.2s steps(5,end) infinite}
    .glint{animation:sweep 4.2s cubic-bezier(.4,0,.2,1) infinite}
  </style>
  <defs>
    <polygon id="prism" points="128,32 224,204 32,204"/>
    <clipPath id="pclip"><use href="#prism"/></clipPath>
    <linearGradient id="face-grad" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="204">
      <stop offset="0" stop-color="#FFF2A6"/><stop offset=".18" stop-color="#FFCE47"/><stop offset=".48" stop-color="#FF9624"/><stop offset=".78" stop-color="#EA5E12"/><stop offset="1" stop-color="#BD3808"/>
    </linearGradient>
    <linearGradient id="side-grad" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="216">
      <stop offset="0" stop-color="#C95214"/><stop offset=".5" stop-color="#94310A"/><stop offset="1" stop-color="#4D1605"/>
    </linearGradient>
    <linearGradient id="glint-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBE6" stop-opacity="0"/><stop offset=".5" stop-color="#FFFBE6" stop-opacity=".4"/><stop offset="1" stop-color="#FFFBE6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="shader-scan" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><rect width="8" height="2" fill="#FFF7D0" opacity=".06"/></pattern>
    <pattern id="voxel-glint" width="64" height="48" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="12" height="6" fill="#FFFBE0" opacity=".15"/><rect x="38" y="18" width="10" height="6" fill="#FFF7C2" opacity=".12"/>
    </pattern>
  </defs>
  <g class="icon-bob">
    <use href="#prism" transform="translate(-4 10)" fill="#2B1308" stroke="#2B1308" stroke-width="14" stroke-linejoin="miter"/>
    <use href="#prism" transform="translate(-4 10)" fill="url(#side-grad)"/>
    <use href="#prism" fill="url(#face-grad)" stroke="#2B1308" stroke-width="8" stroke-linejoin="miter"/>
    <g clip-path="url(#pclip)">
      <rect x="20" y="20" width="216" height="200" fill="url(#voxel-glint)"/>
      <rect x="20" y="20" width="216" height="200" fill="url(#shader-scan)"/>
      <polygon points="128,88 168,172 88,172" fill="#5BA6F7" stroke="#2B1308" stroke-width="5"/>
      <g class="glint"><path d="M0 20h50l-18 200h-50z" fill="url(#glint-grad)"/></g>
    </g>
  </g>
</svg>
